name: Build Geode Mod
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          combine: true
      - uses: actions/upload-artifact@v4
        with:
          name: god-difficulties
          path: ${{ steps.build.outputs.build-output }}
